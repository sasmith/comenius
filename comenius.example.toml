# Copy to comenius.toml and adjust. Every key is optional.

out_dir = "out"

[lesson]
pause_multiplier = 1.0        # raise for running (e.g. 1.3), lower for review listening
pause_answer_factor = 1.5     # pause = multiplier * (factor * answer_seconds + base)
pause_base_s = 1.0
step_gap_s = 1.5             # silence after a drill answer, before the next cue
buildup_rate = 0.9            # speaking rate for build-up fragments
max_buildup_steps = 4
final_listen_syllables_per_s = 7.0   # speed "Listen again" toward native (~7.8); 0 = voice speed
max_tempo = 1.1               # cap on that speed-up (1.2+ sounded rushed)
tempo_method = "provider"     # "provider": ask the voice service to talk faster (new audio);
                              # "stretch": speed the clip up afterward (free, uniform)
in_lesson_recall = false      # English-cued recall woven into the lesson (Pimsleur-style)
recall_intervals_s = [5, 25, 120, 600]
# English narration (all off by default; recall/translation cues are always English)
line_translations = false     # "Ana says: <English>" before each line in build-up
introduce_new_words = false   # "The word for 'tire' is ... llanta"
signposts = true              # "Dialog. Repeat to learn.", "Substitution drills.", ...
guideposts = false            # "Now the whole line.", section instructions, "How do you say: ..."

[tts]
provider = "espeak"           # espeak (offline, robotic), kokoro (local neural), polly, azure,
                              # openai, elevenlabs, or "pool" (mix native voices across providers)
cache_dir = ".cache/tts"
polly_engine = "generative"   # or "neural"
polly_region = "us-east-1"
azure_region = "westus2"      # or AZURE_SPEECH_REGION
openai_model = "gpt-4o-mini-tts"
kokoro_dir = "~/.cache/comenius/kokoro"

# Pool mode: each lesson's speakers are drawn from these voices (providers without
# credentials are skipped); the choice is seeded by lesson id. Setting `pool` replaces
# the default list (Polly Mia/Andres/Lupe/Pedro and six Azure es-MX/es-US voices).
# narrators = ["polly:Ruth", "azure:en-US-AndrewMultilingualNeural", "kokoro:af_heart", "espeak:en-us"]
# [[tts.pool]]
# provider = "polly"
# voice = "Mia"
# lang = "es"
# gender = "female"
# accent = "es-MX"
# [[tts.pool]]
# provider = "azure"
# voice = "es-MX-JorgeNeural"
# lang = "es"
# gender = "male"
# accent = "es-MX"

# Override voices per provider (roles: narrator, female_1, male_1, female_2, male_2)
# [tts.voices.azure]
# female_1 = "es-MX-DaliaNeural"
# male_1 = "es-MX-JorgeNeural"
# [tts.voices.elevenlabs]
# narrator = "<voice id>"
# female_1 = "<voice id>"
# male_1 = "<voice id>"

[llm]
backend = "api"               # "api" (ANTHROPIC_API_KEY) or "claude-code" (your Claude Code sign-in)
model = "claude-sonnet-5-5"
max_attempts = 3

[state]
path = "~/.local/share/comenius/state.db"   # learner state (lessons done, review schedule)
review_items = 5              # due items reviewed per lesson
new_grammar_points = 1        # syllabus points introduced per planned lesson
queue_words_per_lesson = 3    # queued words required per planned lesson

[anki]
url = "http://127.0.0.1:8765"  # AnkiConnect, for `comenius anki push`

[feed]
title = "Comenius: Spanish"
description = "Generated audio Spanish lessons."
site_dir = "site"
# Upload target for `comenius publish`: an S3 bucket (see README for the bucket policy).
bucket = ""
prefix = ""                   # long random string; the feed URL is the only "password"
# region = "us-east-2"        # looked up from the bucket if unset
# The public URL defaults to https://<bucket>.s3.<region>.amazonaws.com/<prefix>.
# Set base_url only when it differs (CloudFront, a custom domain, R2):
# base_url = "https://d111111abcdef8.cloudfront.net/<prefix>"
# S3-compatible stores such as Cloudflare R2 (base_url required):
# endpoint_url = "https://<account-id>.r2.cloudflarestorage.com"
# base_url = "https://pub-xxxx.r2.dev/<prefix>"
