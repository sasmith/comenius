# Copy to comenius.toml and adjust. Every key is optional.

out_dir = "out"

[lesson]
pause_multiplier = 1.0        # raise for running (e.g. 1.3), lower for review listening
pause_answer_factor = 1.5     # pause = multiplier * (factor * answer_seconds + base)
pause_base_s = 1.0
step_gap_s = 1.5             # silence after a drill answer, before the next cue
buildup_rate = 0.9            # speaking rate for build-up fragments
max_buildup_steps = 4
in_lesson_recall = false      # English-cued recall woven into the lesson (Pimsleur-style)
recall_intervals_s = [5, 25, 120, 600]
# English narration (all off by default; recall/translation cues are always English)
line_translations = false     # "Ana says: <English>" before each line in build-up
introduce_new_words = false   # "The word for 'tire' is ... llanta"
signposts = true              # "Dialog. Repeat to learn.", "Substitution drills.", ...
guideposts = false            # "Now the whole line.", section instructions, "How do you say: ..."

[tts]
provider = "espeak"           # espeak (offline), azure, openai, elevenlabs
cache_dir = ".cache/tts"
azure_region = "westus2"      # or AZURE_SPEECH_REGION
openai_model = "gpt-4o-mini-tts"

# Override voices per provider (roles: narrator, female_1, male_1, female_2, male_2)
# [tts.voices.azure]
# female_1 = "es-MX-DaliaNeural"
# male_1 = "es-MX-JorgeNeural"
# [tts.voices.elevenlabs]
# narrator = "<voice id>"
# female_1 = "<voice id>"
# male_1 = "<voice id>"

[llm]
model = "claude-sonnet-5-5"
max_attempts = 3

[feed]
title = "Comenius: Spanish"
description = "Generated audio Spanish lessons."
base_url = "https://example-bucket.s3.amazonaws.com/some-long-random-path"
