# Default lesson topics: everyday situations in rough order of difficulty.
#
# `plan` uses these when you don't pass --topic and the queue has no unfinished
# situation: it picks the first one you haven't had whose level is at or below the
# level of the next syllabus point.
#
# Language-neutral on purpose. Each entry describes what happens, not where; the
# generator sets the scene in the target language's culture and dialect.
#
# Themes follow the Council of Europe's Waystage/Threshold specifications (the basis
# of the CEFR levels). Levels are CEFR. Ids are stable; the wording can be edited.

